---
- name: Require destination networks when forwarding
  when: netbird_forwarding_enabled | bool
  assert:
    that:
      - 'netbird_forwarding_networks | type_debug == "list"'
      - 'netbird_forwarding_networks | length > 0'
    fail_msg: |
      Set netbird_forwarding_networks to a list of CIDRs when netbird_forwarding_enabled is true.

- name: Configure persistent IP forwarding
  sysctl:
    name:  '{{ item }}'
    value: '{{ "1" if netbird_forwarding_enabled | bool else "0" }}'
    sysctl_file: '/etc/sysctl.d/99-netbird.conf'
    reload: true
  loop:
    - 'net.ipv4.ip_forward'
    - 'net.ipv6.conf.all.forwarding'

- name: Install NetBird nftables masquerade rule
  when: netbird_forwarding_enabled | bool
  template:
    src:  'netbird-forwarding.nft.j2'
    dest: '{{ netbird_forwarding_rule_path }}'
    mode: '0o644'
  notify: Reload nftables

- name: Remove NetBird nftables masquerade rule when forwarding is disabled
  when: not netbird_forwarding_enabled | bool
  file:
    path: '{{ netbird_forwarding_rule_path }}'
    state: absent
  notify: Reload nftables
