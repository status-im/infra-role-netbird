---
# Mandatory variable for setup
#netbird_setup_key: ~

netbird_service_name: 'netbird'
netbird_port: 51820
netbird_setup_flags:
  - '--no-browser'

# Metrics
netbird_metrics_enabled: true
netbird_metrics_host: '0.0.0.0'
netbird_metrics_port: 9191

netbird_apt_repo_url: 'https://pkgs.netbird.io/debian'
netbird_apt_repo_suite: 'stable'
netbird_apt_repo_component: 'main'
netbird_apt_repo_key_url: 'https://pkgs.netbird.io/debian/public.key'
netbird_apt_repo_key_sha256: '6bd434c07e7c3a71211de79ca287e93b45deadedc4b74f1a2e83e11abe6e0bf5'
netbird_apt_repo_keyring: '/usr/share/keyrings/netbird-archive-keyring.asc'
netbird_apt_repo_filename: 'netbird'

# Local DNS Server
netbird_systemd_resolved_host: '0.0.0.0'
netbird_systemd_resolved_port: 153

# Traffic Forwarding
netbird_forwarding_enabled: false
#netbird_forwarding_source_network: ~
netbird_forwarding_in_interface: 'wt0'
netbird_forwarding_out_interface: 'wg0'
netbird_forwarding_networks: []
netbird_forwarding_rule_path: '/etc/nft.conf.d/nat/postrouting/netbird.nft'

# Reverse Proxy service
netbird_proxy_enabled: false
netbird_proxy_cont_name: 'netbird-reverse-proxy'
netbird_proxy_cont_path: '/docker/{{ netbird_proxy_cont_name }}'
#netbird_proxy_domain: 'infra.example.org'
#netbird_proxy_token: ~
#netbird_proxy_certs_path: ~
netbird_proxy_log_level: 'info'
netbird_proxy_private: true
netbird_proxy_acme_certs_enabled: true
netbird_proxy_http_port: 80
netbird_proxy_https_port: 443
netbird_proxy_image: 'netbirdio/reverse-proxy:latest'

# Consul service definition settings
netbird_consul_service_name: 'netbird'
netbird_consul_metrics_service_name: '{{ netbird_consul_service_name }}-metrics'
netbird_consul_proxy_service_name: '{{ netbird_consul_service_name }}-proxy'
netbird_consul_service_file_name: '{{ netbird_service_name | replace("-", "_") }}'
netbird_consul_check_disabled: false
netbird_consul_check_interval: '60s'
netbird_consul_check_timeout: '5s'
netbird_consul_success_before_passing: 0
netbird_consul_failures_before_warning: 1
netbird_consul_failures_before_critical: 2

# general container management
compose_recreate: 'auto'
compose_state: 'present'
compose_pull: 'always'
