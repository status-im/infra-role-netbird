---
# Mandatory variable for setup
#netbird_setup_key: ~

netbird_service_name: 'netbird'
netbird_port: 51820
netbird_setup_flags:
  - '--no-browser'

# Metrics
netbird_metrics_enabled: true
netbird_metrics_host: '0.0.0.0'
netbird_metrics_port: 9191

netbird_apt_repo_url: 'https://pkgs.netbird.io/debian'
netbird_apt_repo_suite: 'stable'
netbird_apt_repo_component: 'main'
netbird_apt_repo_key_url: 'https://pkgs.netbird.io/debian/public.key'
netbird_apt_repo_key_sha256: '6bd434c07e7c3a71211de79ca287e93b45deadedc4b74f1a2e83e11abe6e0bf5'
netbird_apt_repo_keyring: '/usr/share/keyrings/netbird-archive-keyring.asc'
netbird_apt_repo_filename: 'netbird'

netbird_forwarding_enabled: false
#netbird_forwarding_source_network: ~
netbird_forwarding_in_interface: 'wt0'
netbird_forwarding_out_interface: 'wg0'
netbird_forwarding_networks: []
netbird_forwarding_rule_path: '/etc/nft.conf.d/nat/postrouting/netbird.nft'
